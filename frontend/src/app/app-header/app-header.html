<nav>
    <ul class="menu">
        <!-- Menú desplegable File -->
        <li class="dropdown">
            <button type="button" class="menu-link">File</button>
            <ul class="submenu">
                <li>
                <button type="button" class="submenu-btn" (click)="fileInput.click()">
                    Open
                </button>
                </li>
                <li>
                <button type="button" class="submenu-btn" (click)="exportWav()">
                    Export
                </button>
                </li>
            </ul>
            </li>

            <input
            #fileInput
            type="file"
            accept=".tape,.txt,text/plain"
            hidden
            (change)="onFileSelected($event)"
        />

        <!-- Selector de Pestañas (Edit / View) -->
        <li class="tab-group">
            <button class="tab-btn" [class.active]="activeTab==='edit'" (click)="setTab('edit')" data-tab="edit">Edit</button>
            <button class="tab-btn" [class.active]="activeTab==='view'" (click)="setTab('view')" data-tab="view">View</button>
        </li>

        <!-- Herramientas de la Pestaña "Edit" -->
        @if (activeTab === 'edit') {
            <li class="tab-content active">
                <button class="action-btn primary" (click)="build()">Build</button>
            </li>
        }        

        <!-- Herramientas de la Pestaña "View" -->
        @if (activeTab === 'view') {
            <li class="tab-content active">
                <div class="button-group">
                    <button class="action-btn primary"
                    (click)="onRun()"
                    [disabled]="!isCompiled || audioEngine.playbackState() === 'playing'">
                    Run</button>
                    <button class="action-btn"
                    (click)="onPause()"
                    [disabled]="!isCompiled || audioEngine.playbackState() !== 'playing'">Pause</button>
                    <button class="action-btn"
                    (click)="onStop()"
                    [disabled]="!isCompiled || audioEngine.playbackState() === 'stopped'">Stop</button>
                </div>
            </li>
        }
        <div class="bpm-control">
            <label for="bpm-input">BPM</label>
            <input
|                id="bpm-input"
|                type="number"
|                min="40"
|                max="300"
|                step="1"
|                [value]="audioEngine.bpm()"
|                (change)="onBpmChange($event)"
|                class="bpm-input"
            />
        </div>
        <div>
            @if (compileTimeMs() !== null) {
                <span class="compile-timer">
                    {{ compileTimeMs()! >= 1000 ? ((compileTimeMs()! / 1000).toFixed(2) + ' s') : (compileTimeMs() + ' ms') }}
                </span>
            }
        </div>
    </ul>
</nav>
