<div class="editor-container">
  <div class="line-numbers" #lineNumbersRef>
    @for (item of [].constructor(lines); track $index) {
      <span>{{ $index + 1 }}</span>
    }
  </div>
  <textarea
    #textareaRef
    [(ngModel)]="codeContent"
    (scroll)="onScroll($event)"
    (input)="onInput()"
    (keydown)="onKeyDown($event)"
    spellcheck="false"
    placeholder="Escribe tu código..."
  ></textarea>
</div>
