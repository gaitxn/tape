<div class="table-container">
    <table class="scrollable-table">
        <thead>
            <tr>
                <!-- Esquina superior izquierda fija -->
                <th class="sticky-corner"></th>
                
                <!-- Números del 1 a N sobre cada columna -->
                @for (col of cols; track $index) {
                    <th class="col-header">{{ $index + 1 }}</th>
                }
            </tr>
        </thead>
        <tbody>
            @for (rowLabel of rows; track rowLabel; let rIndex = $index) {
                <tr>
                    <!-- Columna de ABCD fijada a la izquierda -->
                    <th class="sticky-col row-header">{{ rowLabel }}</th>
                    
                    <!-- Celdas interactivas de la cuadrícula -->
                    @for (col of cols; track cIndex; let cIndex = $index) {
                        <td 
                            [class.active]="isActive(rIndex, cIndex)" 
                            (click)="toggleCell(rIndex, cIndex)">
                            {{ rIndex }}:{{ cIndex }}
                        </td>
                    }
                </tr>
            }
        </tbody>
    </table>
</div>
