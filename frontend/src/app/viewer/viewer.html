<div class="table-container">
    <table class="scrollable-table">
        <tbody>
            @for (row of grid; track $index) {
                <tr>
                    {{ this.letters[$index] }}
                    @for (cell of row; track $index) {
                        <td 
                            [class.active]="cell.active" 
                            (click)="cell.active = !cell.active">
                            {{ cell.text }}
                        </td>
                    }
                </tr>
            }
        </tbody>
    </table>
</div>
